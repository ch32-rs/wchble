[workspace]

[package]
name = "ch585-active-scanner"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
# Test only: answer only controlled-source advertisements carrying manufacturer
# data 0xFFFF + "O2ADV" + 0x01. The RX/TX path is identical; this only adds a
# comparison and the response marker gate.
target-src = []

[dependencies]
ch5xx-hal = { path = "../../../ch5xx-hal", features = ["ch585", "rt", "memory-x"], default-features = false }
wchble = { path = "../..", features = ["ch585", "controller"] }
qingke-rt = { version = "0.8.4", features = ["highcode"] }
panic-halt = "1.0"
static_cell = "2.1"
portable-atomic = { version = "1.11", features = ["critical-section"] }

[profile.release]
strip = false
lto = true
opt-level = 3
