[workspace]

[package]
name = "ch585-trouble-gatt"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
long-run = []
# S2: LE Secure Connections Just Works through Trouble's security feature.
# The RustCrypto backend supplies AES-128 ECB/CMAC and P-256 ECDH; the RNG
# driver is provided by this example and seeded from measured ADC noise.
secure = [
    "trouble-host/security",
    "dep:embassy-crypto",
    "dep:embassy-crypto-rustcrypto",
    "dep:embassy-time-driver",
]
# Test-only: ask the central for a fixed connection interval over L2CAP.
conn-params-30 = []
conn-params-48 = []

[dependencies]
ch5xx-hal = { path = "../../../ch5xx-hal", features = ["ch585", "rt", "memory-x"], default-features = false }
wchble = { path = "../..", features = ["ch585", "controller"] }
qingke-rt = { version = "0.8.4", features = ["highcode"] }
panic-halt = "1.0"
static_cell = "2.1"
portable-atomic = { version = "1.11", features = ["critical-section"] }
# Local Trouble checkout: 3aa6fd27b89cd5fc35f5c9b4f0c7f66795a14f70 (bt-hci 0.11).
trouble-host = { path = "../../../trouble/host", default-features = false, features = ["peripheral", "gatt", "default-packet-pool", "default-packet-pool-mtu-27"] }
embassy-sync = { version = "0.8", default-features = false }
embassy-futures = "0.1"
embassy-time = { version = "0.5", default-features = false, features = ["tick-hz-1_000_000"] }
embassy-time-driver = { version = "0.2", optional = true }
heapless = "0.9"
# Same pinned Embassy revision as the local Trouble checkout (bt-hci 0.11).
embassy-crypto = { git = "https://github.com/embassy-rs/embassy.git", rev = "bd35bd7a7d19147c8bcae9c2eda99b25e597294c", optional = true }
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy.git", rev = "bd35bd7a7d19147c8bcae9c2eda99b25e597294c", optional = true, features = [
    "embassy-crypto-aes128-ecb",
    "embassy-crypto-aes128-cmac",
    "embassy-crypto-p256-ecdh",
] }

[profile.release]
strip = false
lto = true
opt-level = 3
