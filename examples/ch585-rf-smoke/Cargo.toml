[workspace]

[package]
name = "ch585-rf-smoke"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ch5xx-hal = { path = "../../../ch5xx-hal", features = [
    "ch585",
    "rt",
    "memory-x",
], default-features = false }
wchble = { path = "../..", features = ["ch585", "controller"] }
qingke-rt = "0.8.4"
qingke = "0.8.4"
panic-halt = "1.0"
static_cell = "2.1"
portable-atomic = { version = "1.11", features = ["critical-section"] }

[features]
# One-shot AES known-answer test: init the radio, run the KAT, log to RAM and
# park with RF off so the probe can read the result safely.
aes-kat = []
# Modes are one-at-a-time: `aes-kat` parks first, `crc-test` loops without
# broadcasting/peer listening, `peer-rx` is the interop receive mode.
# Listen on ch37 every round and dump hits (CH573 -> CH585 interop); default
# keeps the original periodic 5 ms smoke listen.
peer-rx = []
# Transmit crcgood/crcbad! on ch37 with correct/wrong CRC init for a
# receiver-side CRC known-answer test (`crc-test-bad` flips the init).
crc-test = []
crc-test-bad = ["crc-test"]
# Append a 16-bit air-event counter (manufacturer AD) to the advertising PDU
# so a board receiver and a sniffer can be paired event by event.
adv-seq = []
# adv-seq plus a single-channel 20 ms broadcast on ch37, for dense paired
# captures (implies adv-seq).
adv-ch37 = ["adv-seq"]

[profile.release]
strip = false
lto = true
opt-level = "z"
