[workspace]

[package]
name = "ch32v208-trouble-adv"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ch32-hal = { path = "../../../ch32-hal", features = [
    "ch32v208wbu6",
    "memory-x",
    "embassy",
    "rt",
], default-features = false }
wchble = { path = "../..", features = ["ch32v208", "controller"] }
# crates.io 0.8.0 still pins bt-hci 0.10; use a sibling checkout of
# embassy-rs/trouble (main, bt-hci 0.11) until crates.io catches up.
trouble-host = { path = "../../../trouble/host", default-features = false, features = [
    "peripheral",
    "default-packet-pool",
] }
embassy-executor = { version = "0.10.0", features = [
    "platform-spin",
    "executor-thread",
] }
embassy-time = "0.5.1"
embassy-futures = "0.1.2"
bt-hci = { version = "0.11", default-features = false }
qingke-rt = "0.8"
qingke = "0.8"
panic-halt = "1.0"
static_cell = "2.1"

[profile.release]
strip = false
lto = true
opt-level = "z"
