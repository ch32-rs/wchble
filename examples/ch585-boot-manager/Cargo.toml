[workspace]

[package]
name = "ch585-boot-manager"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ch5xx-hal = { path = "../../../ch5xx-hal", features = ["ch585", "rt", "flash"], default-features = false }
wchble = { path = "../..", features = ["ch585"], default-features = false }
qingke-rt = { version = "0.8.4", features = ["highcode"] }
panic-halt = "1.0"
portable-atomic = { version = "1.11", features = ["critical-section"] }

[profile.release]
strip = false
lto = true
