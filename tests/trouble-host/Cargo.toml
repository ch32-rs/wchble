[workspace]

[package]
name = "wchble-trouble-host-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
wchble = { path = "../..", features = ["ch585", "controller"] }
# Same local Trouble revision and Host feature set as ch585-trouble-gatt.
trouble-host = { path = "../../../trouble/host", default-features = false, features = [
    "peripheral",
    "gatt",
    "default-packet-pool",
    # X4: MTU 124 and queued writes, matching the example.
    "default-packet-pool-mtu-128",
    "att-queued-writes",
    # X2a: `advertise_ext` for the extended advertising beacon fixture.
    "extended-advertising",
] }
embassy-sync = { version = "0.8", default-features = false }
embassy-futures = "0.1"
# beacon.rs mirrors the example's AdvertisementSet construction.
embassy-time = { version = "0.5", default-features = false }
heapless = "0.9"
critical-section = { version = "1", features = ["std"] }
portable-atomic = { version = "1.11", features = ["critical-section"] }
